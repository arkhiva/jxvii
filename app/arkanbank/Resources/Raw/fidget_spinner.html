    <title>Fidget Spinner</title>

    <style>
        /* =========================================================
           Layout
           ========================================================= */

        html,
        body {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            align-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #bea1fe38;
            touch-action: none;
        }


        /* =========================================================
           Wrapper
           ========================================================= */

        #wrapper {
            width: 50vmin;
            height: 50vmin;
            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* =========================================================
           Spinner
           ========================================================= */

        #fidget-spinner {
            width: 100%;
            height: 100%;
            cursor: grab;
            user-select: none;
            transform-origin: center center;
            touch-action: none;
        }


            #fidget-spinner:active {
                cursor: grabbing;
            }


        /* =========================================================
           Cores
           ========================================================= */

        .circle {
            fill: transparent;
        }


        .bearing {
            fill: #da6bf0;
        }


        .spinner {
            fill: #ff75ff;
        }
    </style>

</head>

    <script>

        /*
         * =========================================================
         * Fidget Spinner
         * =========================================================
         */

        const spinner =
            document.getElementById("fidget-spinner");


        let rotation = 0;

        let dragging = false;

        let lastAngle = 0;

        let lastTime = 0;

        let velocity = 0;

        let animationFrame = null;


        /*
         * =========================================================
         * Controle da velocidade
         * =========================================================
         *
         * Guardamos várias amostras do movimento.
         *
         * Isso evita que um único pointermove com um delta pequeno
         * faça o spinner perder toda a velocidade quando o usuário
         * solta o dedo rapidamente.
         */

        const velocitySamples = [];

        const maxVelocitySamples = 8;


        /*
         * ---------------------------------------------------------
         * Calcula o ângulo do ponteiro em relação ao centro
         * ---------------------------------------------------------
         */

        function getAngle(event) {

            const rect =
                spinner.getBoundingClientRect();


            const centerX =
                rect.left + rect.width / 2;

            const centerY =
                rect.top + rect.height / 2;


            const pointX =
                event.clientX - centerX;

            const pointY =
                event.clientY - centerY;


            return Math.atan2(pointY, pointX) * 180 / Math.PI;
        }


        /*
         * ---------------------------------------------------------
         * Inicia o arraste
         * ---------------------------------------------------------
         */

        spinner.addEventListener(
            "pointerdown",
            function (event) {

                event.preventDefault();


                dragging = true;


                spinner.setPointerCapture(
                    event.pointerId
                );


                lastAngle =
                    getAngle(event);


                lastTime =
                    performance.now();


                velocity = 0;


                /*
                 * Limpa as velocidades anteriores.
                 */

                velocitySamples.length = 0;


                /*
                 * Para qualquer inércia anterior.
                 */

                cancelAnimationFrame(
                    animationFrame
                );
            }
        );


        /*
         * ---------------------------------------------------------
         * Movimento
         * ---------------------------------------------------------
         */

        spinner.addEventListener(
            "pointermove",
            function (event) {

                if (!dragging) {
                    return;
                }


                event.preventDefault();


                const currentAngle =
                    getAngle(event);


                let delta =
                    currentAngle - lastAngle;


                /*
                 * Corrige a passagem de -180° para 180°.
                 */

                if (delta > 180) {
                    delta -= 360;
                }


                if (delta < -180) {
                    delta += 360;
                }


                const now =
                    performance.now();


                const deltaTime =
                    now - lastTime;


                /*
                 * Calcula a velocidade angular.
                 *
                 * A velocidade fica em graus por milissegundo.
                 */

                if (deltaTime > 0) {

                    const currentVelocity =
                        delta / deltaTime;


                    /*
                     * Guarda a velocidade atual.
                     */

                    velocitySamples.push(
                        currentVelocity
                    );


                    /*
                     * Mantém somente as últimas amostras.
                     */

                    if (
                        velocitySamples.length >
                        maxVelocitySamples
                    ) {

                        velocitySamples.shift();
                    }
                }


                /*
                 * Atualiza a rotação manual.
                 */

                rotation += delta;


                spinner.style.transform =
                    `rotate(${rotation}deg)`;


                lastAngle =
                    currentAngle;


                lastTime =
                    now;
            }
        );


        /*
         * ---------------------------------------------------------
         * Finaliza o arraste
         * ---------------------------------------------------------
         */

        function stopDragging() {

            if (!dragging) {
                return;
            }


            dragging = false;


            /*
             * Calcula a velocidade de lançamento
             * utilizando as últimas amostras.
             */

            calculateReleaseVelocity();


            startInertia();
        }


        spinner.addEventListener(
            "pointerup",
            stopDragging
        );


        spinner.addEventListener(
            "pointercancel",
            stopDragging
        );


        spinner.addEventListener(
            "lostpointercapture",
            stopDragging
        );


        /*
         * ---------------------------------------------------------
         * Calcula a velocidade ao soltar
         * ---------------------------------------------------------
         */

        function calculateReleaseVelocity() {

            if (velocitySamples.length === 0) {

                velocity = 0;

                return;
            }


            /*
             * Média ponderada.
             *
             * As amostras mais recentes possuem
             * maior influência na velocidade final.
             */

            let weightedSum = 0;

            let totalWeight = 0;


            for (
                let i = 0;
                i < velocitySamples.length;
                i++
            ) {

                const weight =
                    i + 1;


                weightedSum +=
                    velocitySamples[i] * weight;


                totalWeight +=
                    weight;
            }


            velocity =
                weightedSum / totalWeight;


            /*
             * Converte para uma velocidade adequada
             * para o loop de animação.
             *
             * 16.67 representa aproximadamente
             * um frame de 60 FPS.
             */

            velocity *= 16.67;


            /*
             * Evita velocidades absurdamente altas
             * causadas por movimentos muito rápidos.
             */

            const maxVelocity = 50;


            if (velocity > maxVelocity) {
                velocity = maxVelocity;
            }


            if (velocity < -maxVelocity) {
                velocity = -maxVelocity;
            }
        }


        /*
         * ---------------------------------------------------------
         * Inércia
         * ---------------------------------------------------------
         */

        function startInertia() {

            cancelAnimationFrame(
                animationFrame
            );


            let lastFrameTime =
                performance.now();


            function animate() {

                const now =
                    performance.now();


                const deltaTime =
                    now - lastFrameTime;


                lastFrameTime =
                    now;


                /*
                 * Para quando a velocidade ficar
                 * praticamente insignificante.
                 */

                if (Math.abs(velocity) < 0.01) {

                    velocity = 0;

                    return;
                }


                /*
                 * Normaliza o movimento para aproximadamente
                 * 60 FPS.
                 */

                const frameMultiplier =
                    deltaTime / 16.67;


                rotation +=
                    velocity * frameMultiplier;


                spinner.style.transform =
                    `rotate(${rotation}deg)`;


                /*
                 * Resistência do spinner.
                 *
                 * Quanto mais próximo de 1,
                 * mais tempo ele continua girando.
                 */

                const friction =
                    Math.pow(0.995, frameMultiplier);


                velocity *=
                    friction;


                animationFrame =
                    requestAnimationFrame(
                        animate
                    );
            }


            animationFrame =
                requestAnimationFrame(
                    animate
                );
        }

    </script>
