<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{{site.site_title}}</title>
        <style>
            html,
            body {
                margin: 0;
                width: 100%;
                height: 100%;
                background: #000;
                overflow: hidden;
            }

            iframe {
                width: 100%;
                height: 100%;
                border: 0;
            }
        </style>
    </head>
    <body>
        <iframe
            src="{{ page.video | replace: '/view', '/preview' }}"
            allow="autoplay; fullscreen"
            allowfullscreen>
        </iframe>
    </body>
</html>
